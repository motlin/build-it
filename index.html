<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>Build <b>It!</b></h1><span id="round"></span></div>
    <div class="chips" id="chips"></div>
    <button id="mute" aria-label="Toggle sound">Sound on</button>
  </header>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Platformer course"></canvas>
    <div class="touch"><div><button data-k="l" aria-label="Left">◀</button><button data-k="r" aria-label="Right">▶</button></div><div><button data-k="d" aria-label="Crouch">▼</button><button data-k="j" aria-label="Jump">▲</button></div></div>
  </div>
  <div class="tray" id="tray"></div>
</div>
<div class="ov" id="ov"></div>
<div id="pop" aria-live="polite"></div>
<script type="module" src="/src/main.ts"></script>
</body>
